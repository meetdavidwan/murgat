# Stage config for running Qwen3-Omni-MoE (Text Only) on 4x RTX A6000
# Stage 0: Thinker Only (Devices 0,1,2,3)
# - Audio stages (Talker, Code2Wav) have been removed.
# - Tensor Parallelism increased to 4 to utilize full hardware.

async_chunk: false
stage_args:
  - stage_id: 0
    stage_type: llm
    runtime:
      devices: "0,1,2,3"
      max_batch_size: 128
    engine_args:
      model_stage: thinker
      model_arch: Qwen3OmniMoeForConditionalGeneration
      worker_type: ar
      scheduler_cls: vllm_omni.core.sched.omni_ar_scheduler.OmniARScheduler
      gpu_memory_utilization: 0.9
      enforce_eager: true
      trust_remote_code: true
      engine_output_type: text
      distributed_executor_backend: "mp"
      enable_prefix_caching: true
      max_num_batched_tokens: 131072
      hf_config_name: thinker_config
      tensor_parallel_size: 4
    final_output: true
    final_output_type: text
    is_comprehension: true
    default_sampling_params:
      temperature: 0.4
      top_p: 0.9
      top_k: 1
      max_tokens: 2048
      seed: 42
      detokenize: True
      repetition_penalty: 1.05